<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Evacuation Readiness Assessment</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Evac Assessment">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1d6b45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: field tool. Sticky header + step rail (left on iPad landscape, top strip on narrow). Exit-sign green accent, signal amber/red for gaps. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --surface-2:#e9eee9; --line:#cdd6ce; --fg:#16211b; --muted:#56655b;
  --accent:#1d6b45; --accent-ink:#ffffff; --accent-soft:#dcefe3;
  --ok:#1d6b45; --warn:#a86300; --warn-soft:#fbecd2; --bad:#b3261e; --bad-soft:#f8dcd9;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#16201b; --surface-2:#1d2a23; --line:#2d3d34; --fg:#e6eee8; --muted:#97a89d;
  --accent:#4fbf86; --accent-ink:#06130c; --accent-soft:#18392a;
  --ok:#4fbf86; --warn:#f0a43a; --warn-soft:#3a2b12; --bad:#f2766c; --bad-soft:#3d1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#16201b; --surface-2:#1d2a23; --line:#2d3d34; --fg:#e6eee8; --muted:#97a89d;
  --accent:#4fbf86; --accent-ink:#06130c; --accent-soft:#18392a;
  --ok:#4fbf86; --warn:#f0a43a; --warn-soft:#3a2b12; --bad:#f2766c; --bad-soft:#3d1a18; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0}
.homenote{font-size:13px;color:var(--muted);margin:0;max-width:68ch}
@media print{.top,.rail,body::before,.noprint,main>.row:last-child{display:none!important}.shell{display:block;padding:0}body,html{background:#fff}.report{border:0;padding:0}.rsec,.tablewrap,.bars,.verdict,.photos figure{break-inside:avoid}}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand .mark svg{width:20px;height:20px}
.brand b{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--muted);font-size:13px;display:block;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1}
.status{font-family:var(--mono);font-size:12px;padding:4px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn);background:var(--warn-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:4px}
.rail button{display:flex;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--muted)}
.rail button .q{font-family:var(--display);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;min-width:44px;color:var(--accent)}
.rail button[aria-current="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.rail .sep{height:1px;background:var(--line);margin:8px 4px}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .rail button{flex:none;flex-direction:column;gap:0;padding:8px 10px}
  .rail .sep{display:none}
}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.pagehead{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--accent)}
.pagehead h1{font-size:34px;font-weight:700}
.pagehead p{margin:0;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:22px;font-weight:600}
.panel .hint{color:var(--muted);font-size:13px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label,.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:76px;resize:vertical}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--bg);padding:0 12px;min-height:40px;cursor:pointer;border-right:1px solid var(--line);font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button.okv[aria-pressed="true"]{background:var(--ok);color:var(--accent-ink)}
.seg button.warnv[aria-pressed="true"]{background:var(--warn);color:#fff}
.seg button.badv[aria-pressed="true"]{background:var(--bad);color:#fff}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.stepper button{width:42px;border:0;background:var(--surface-2);cursor:pointer;font-size:20px;line-height:1}
.stepper input{border:0;border-radius:0;text-align:center;min-width:0;background:transparent}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rowq{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rowq:first-of-type{border-top:0}
@media (max-width:560px){.rowq{grid-template-columns:minmax(0,1fr)}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* home */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left}
.acard:hover{border-color:var(--accent)}
.acard h3{font-size:22px}
.acard .meta{color:var(--muted);font-size:13px}
.tag{display:inline-block;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;background:var(--warn-soft);color:var(--warn);text-transform:uppercase;letter-spacing:.05em}
.empty{border:2px dashed var(--line);border-radius:12px;padding:32px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
/* floors */
.btabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.floor{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.floor>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px}
.floor>summary::-webkit-details-marker{display:none}
.lvl{font-family:var(--display);font-weight:700;font-size:28px;text-align:center;background:var(--surface-2);border-radius:8px;padding:4px 0;line-height:1.1}
.lvl small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted)}
.fsum{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.ok{background:var(--accent-soft);color:var(--ok)}
.fbody{border-top:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:18px}
.fsec{display:flex;flex-direction:column;gap:10px}
.fsec>h3{font-size:17px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cam{cursor:pointer;color:var(--fg);position:relative}
.cam:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.imp>.thumbs{grid-column:1/-1}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:112px;height:84px;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.broken img{display:none}.thumb.broken::after{content:"Photo unavailable";position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center}
.thumb.busy{display:grid;place-items:center;font-size:12px;color:var(--muted)}
.thumbx{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.thumbconfirm{position:absolute;inset:0;background:var(--surface);flex-direction:column;justify-content:center;gap:4px;padding:4px}
.thumbconfirm .btn{min-height:26px;font-size:11px;padding:0 6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.photos figure{margin:0;display:flex;flex-direction:column;gap:6px;break-inside:avoid}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}
.photos img[data-missing]{display:none}
.photos figcaption{font-size:13px;color:var(--muted)}
.photos figcaption b{color:var(--fg)}
.blist{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:end}
.unit{display:grid;grid-template-columns:minmax(0,1fr) 140px 40px;gap:8px;align-items:center}
@media (max-width:520px){.unit{grid-template-columns:minmax(0,1fr) 110px 40px}}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;display:grid;place-items:center}
.imp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.imp:first-child{border-top:0}
@media (max-width:620px){.imp{grid-template-columns:minmax(0,1fr)}}
.calcbox{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;background:var(--surface-2);border-radius:10px;padding:12px}
.calcbox div b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.calcbox div span{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td:has(>input),td:has(>.iconbtn),td:has(>.confirm){vertical-align:middle}
tr:has(input) td{vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20}
/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:26px;min-width:0}
.rep-head{display:flex;flex-direction:column;gap:6px;border-bottom:3px solid var(--accent);padding-bottom:16px}
.rep-head h1{font-size:38px}
.rep-head .meta{color:var(--muted);font-size:14px}
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.dial{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:40px;border:8px solid var(--line);flex:none}
.verdict h2{font-size:26px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--mono);font-size:24px;font-weight:500}
.tile span{font-size:12px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:14px}
.bar .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
@media (max-width:520px){.bar{grid-template-columns:100px minmax(0,1fr) 40px}}
.rsec{display:flex;flex-direction:column;gap:10px}
.rsec>h2{font-size:26px;display:flex;gap:12px;align-items:baseline}
.rsec>h2 .w{font-family:var(--display);color:var(--accent);text-transform:uppercase;letter-spacing:.08em;font-size:16px;min-width:56px}
.rsec p{margin:0;max-width:72ch}
.rsec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.qa{display:grid;grid-template-columns:minmax(160px,240px) minmax(0,1fr);gap:6px 18px;font-size:14px}
.qa dt{color:var(--muted);font-weight:600}
.qa dd{margin:0}
@media (max-width:560px){.qa{grid-template-columns:minmax(0,1fr)}.qa dd{margin-bottom:8px}}
.recs{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:baseline;padding:10px 12px;border-radius:8px;background:var(--bg)}
.pri{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;text-align:center}
.pri.p1{background:var(--bad-soft);color:var(--bad)} .pri.p2{background:var(--warn-soft);color:var(--warn)} .pri.p3{background:var(--accent-soft);color:var(--ok)}
.note{font-size:12px;color:var(--muted)}
.missing{color:var(--warn);font-style:italic}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand"><div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--accent-ink)"><path d="M4 20h4v-4h4v-4h4V8h4"/><path d="M14 4h6v6"/></svg></div>
    <div style="min-width:0"><b>Evacuation Readiness</b><span id="hdrTitle">Ethos Preparedness · Single-Flow Evacuation Assessment</span></div></div>
  <div class="spacer"></div>
  <span class="status" id="status">Loading…</span>
  <button class="btn small" id="homeBtn" data-act="home" hidden>All assessments</button>
</div></div>

<div id="app"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
/* ============ Reference data (from Detailed Hospital Evacuation Readiness Assessment, 2020) ============ */
const CLASSES=[
 {k:'icu',name:'ICU',pct:1},{k:'pacu',name:'PACU',pct:1},{k:'or',name:'OR / Trauma',pct:1},{k:'periop',name:'Post-Op / Pre-Op',pct:1},
 {k:'ante',name:'Antepartum',pct:.75},{k:'ld',name:'Labor & Delivery',pct:.5},{k:'post',name:'Postpartum',pct:.5},
 {k:'neo',name:'Neonatal (6 infants / sled)',pct:.15,peds:1},{k:'nicu',name:'NICU',pct:.75,peds:1},{k:'picu',name:'PICU (6 mo – 2 yrs)',pct:1,peds:1},
 {k:'cardio',name:'Cardio / Telemetry',pct:.5},{k:'ortho',name:'Orthopedic Surgical',pct:.5},{k:'genmed',name:'General Medical / Acute Care',pct:.3},
 {k:'surg',name:'Surgical',pct:.75},{k:'resp',name:'Respiratory',pct:.5},{k:'onc',name:'Oncology / Endocrine',pct:.75},
 {k:'snf',name:'Skilled Nursing / Hospice',pct:.75},{k:'er',name:'Emergency (trauma rooms)',pct:1},{k:'rehab',name:'Rehab / Physical Therapy',pct:.3},
 {k:'psyA',name:'Psychiatric – Adult',pct:.2},{k:'psyE',name:'Psychiatric – Elderly',pct:.5},
 {k:'neuro',name:'Neurosciences (EEG, Radiology)',pct:0,perExit:2},{k:'rad',name:'Radiology / Nuclear Med / Imaging',pct:0,perExit:2},
 {k:'psyY',name:'Psychiatric – Adolescent',pct:0,perExit:2},{k:'wound',name:'Wound Care',pct:0,perExit:2},
 {k:'office',name:'Offices / Admin / Support',pct:0,perExit:1}
];
const grp=c=>c.group||'health';
const SPACES={work:['Open office / workstations','Private offices / conference rooms','Lobby / reception / public areas','Manufacturing / warehouse / shop floor','Laboratory / R&D','Cafeteria / assembly / event space','Fitness center','Onsite clinic / first-aid room','Data center / mechanical / storage','Mixed use','Other'],
 college:['Lecture halls / classrooms','Residence halls','Laboratories / research','Library / study spaces','Student union / dining','Athletics / recreation center','Student health center','Faculty and administrative offices','Performing arts / auditorium','Mechanical / storage / support','Mixed use','Other'],
 school:['General classrooms','Early childhood / Pre-K / kindergarten','Special education / life skills','Science labs / career-tech shops','Gymnasium / athletics','Auditorium / cafeteria / assembly','Library / media center','Nurse’s office / health room','Administration / staff offices','Mechanical / storage / support','Mixed use','Other']};
const spacesFor=(A,G)=>G==='school'&&A.facility.type==='College / University'?SPACES.college:SPACES[G];
const DEF_PEOPLE={census:1,pct:.03,bari:.1};
const peopleRates=A=>(A.assumptions&&A.assumptions.people)||DEF_PEOPLE;
function groupOf(A){const t=A&&A.facility&&A.facility.type;return (t==='School (K-12)'||t==='College / University'||t==='School')?'school':t==='Company'?'work':'health'}
const GROUP_TXT={health:{h2:'Non-ambulatory rate by care class',cls:'Care class',cen:'Census %',unit:'Licensed beds',walkH:'Who is here — beds by patient care class',
   walkHint:'Enter licensed beds per unit. Each care class’s daily census % (Assumptions tab) converts them to occupied beds; percentages shown are the non-ambulatory assumptions; “/exit” classes use sleds per stairwell instead of beds.',
   method:'licensed beds × daily census % × non-ambulatory rate per care class (or sleds per stairwell for imaging, wound care, adolescent psychiatry, neurosciences and non-patient areas)'},

  `<section class="panel"><h2>Facility</h2><div class="grid">${txt('facility.name','Facility name','e.g. Riverside Medical Center')}${txt('facility.address','Address / campus')}${sel('facility.type','Facility type',['Acute care hospital','Children’s hospital','Behavioral health','Skilled nursing / long-term care','Ambulatory / outpatient','Medical office building','Company','School (K-12)','College / University','Other'])}${txt('facility.assessor','Assessor')}<div class="f"><label for="i-facility.date">Assessment date</label><input type="date" id="i-facility.date" data-b="facility.date" value="${esc(A.facility.date)}"></div>${txt('facility.contact','Facility contact','EP coordinator')}${txt('facility.contactTitle','Contact title')}</div>${area('facility.notes','Notes')}</section>
  ${siteBuildings()}`}
const FLOOR_OPTS=Array.from({length:100},(_,i)=>i+1);
function aboveCount(b){return b?b.floors.filter(f=>num(f.level)>=1).length:0}
function siteBuildings(){const A=cur();let rows='';
  for(let i=0;i<5;i++){const b=A.buildings.find(x=>x.slot===i);const n=aboveCount(b);
    rows+=`<div class="brow"><div class="f"><label for="bn-${i}">Building name ${i+1}</label><input type="text" id="bn-${i}" data-bslot="${i}" value="${esc(b?b.name:'')}" placeholder="${i===0?'e.g. Patient Tower':''}"></div><div class="f"><label for="bf-${i}">Number of floors</label><select id="bf-${i}" data-bfloors="${i}"><option value="">—</option>${FLOOR_OPTS.map(k=>`<option value="${k}" ${k===n?'selected':''}>${k}</option>`).join('')}</select></div></div>`;
    if(S.pendingFloors&&S.pendingFloors.slot===i)rows+=`<div class="confirm" style="padding:4px 0 8px">Floors above ${S.pendingFloors.n||0} already have walk data. Remove them? <button class="btn small danger" data-act="floorsYes">Remove floors</button><button class="btn small" data-act="floorsNo">Keep</button></div>`}
  return`<section class="panel"><h2>Buildings</h2><p class="hint">Name each building and choose its number of floors above the exit level. Floors you add here appear in the floor-by-floor walk; basements can be added there.</p><div class="blist">${rows}</div></section>`}
function slotBuilding(A,i){let b=A.buildings.find(x=>x.slot===i);if(!b){b={id:uid(),name:'',slot:i,floors:[]};A.buildings.push(b);A.buildings.sort((a,c)=>a.slot-c.slot)}return b}
function pruneBuilding(A,b){if(!b.name.trim()&&!b.floors.length){A.buildings.splice(A.buildings.indexOf(b),1)}}
function floorHasData(f){return f.units.length>0||!!(f.notes||'').trim()||!!(f.storage||'').trim()||num(f.onHandStd)+num(f.onHandBari)+num(f.onHandPeds)+num(f.trainedDay)+num(f.trainedNight)+num(f.staffDay)+num(f.staffNight)>0||Object.keys(f.imp||{}).length>0}
function applyFloors(A,b,n){b.floors=b.floors.filter(f=>num(f.level)<1||num(f.level)<=n);for(let L=1;L<=n;L++){if(!b.floors.some(f=>Math.round(num(f.level))===L))b.floors.push(newFloor(L))}pruneBuilding(A,b);touch()}

   <div class="grid wide">${txt('who.activation','Who activates an evacuation?','e.g. Administrator on duty / House supervisor as IC')}${txt('who.sweep','Who sweeps and clears each floor?','e.g. Charge nurse with floor warden')}${txt('who.operators','Who performs Med Sled evacuations?','e.g. Unit ERT members, facilities, security')}${numIn('who.drills','Evacuation drills per year')}</div></section>

function viewWhen(){

   ${area('when.waitCriteria','When does the plan call for waiting for EMS / fire?','e.g. Stable building, no fire, defend in place pending structural assessment')}

function thumbs(f,k,fp){const ph=(f.photos&&f.photos[k])||[];const busy=S.uploading===f.id+':'+k;if(!ph.length&&!busy)return'';
  return`<div class="thumbs">${ph.map(x=>`<div class="thumb"><img src="${purl(x.id)}" data-pid="${esc(x.id)}" alt="Photo: ${esc((IMPEDIMENTS.find(i=>i[0]===k)||[,''])[1])}">${S.confirmDel==='ph:'+x.id?`<div class="confirm thumbconfirm"><button class="btn small danger" data-act="delPhotoYes" data-p="${fp}" data-k="${k}" data-v="${esc(x.id)}">Delete photo</button><button class="btn small" data-act="delNo">Keep</button></div>`:`<button class="thumbx" data-act="delPhotoAsk" data-v="${esc(x.id)}" aria-label="Delete photo">×</button>`}</div>`).join('')}${busy?'<div class="thumb busy">Uploading…</div>':''}</div>`}
function photoIds(o){const ids=[];const walk=f=>{for(const k in (f.photos||{}))for(const x of f.photos[k])ids.push(x.id)};if(o.floors)o.floors.forEach(walk);else if(o.buildings)o.buildings.forEach(b=>b.floors.forEach(walk));else walk(o);return ids}
async function dropAssets(ids){for(const id of ids){try{await photoDel(id)}catch(e){}if(PURL[id]){URL.revokeObjectURL(PURL[id]);delete PURL[id]}}}
const PURL={},BLANK='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const purl=id=>PURL[id]||BLANK;
async function hydratePhotos(){const imgs=[...document.querySelectorAll('img[data-pid]')];const need=[...new Set(imgs.filter(i=>!PURL[i.dataset.pid]).map(i=>i.dataset.pid))];
  for(const id of need){try{const b=await photoGet(id);if(b)PURL[id]=URL.createObjectURL(b)}catch(e){}}
  for(const i of imgs){const u=PURL[i.dataset.pid];if(u){if(i.src!==u)i.src=u}else{i.closest('.thumb')?.classList.add('broken');i.setAttribute('data-missing','1')}}}
async function shrink(file){try{const bmp=await createImageBitmap(file);const m=1600,sc=Math.min(1,m/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(b=>r(b),'image/jpeg',.82))}catch(e){return /^image\/(jpeg|png|webp|gif)$/.test(file.type)?file:null}}
function floorSummary(A,f){const c=floorCalc(A,f);
  return`<span class="chip">${fmt(c.nonAmb,1)} non-amb</span><span class="chip">${c.sleds} sleds req.</span><span class="chip ${c.gap?'bad':'ok'}">${c.gap?c.gap+' gap':'equipped'}</span><span class="chip ${c.dayShort||c.nightShort?'warn':'ok'}">${c.rescuers} rescuers/shift${c.dayShort||c.nightShort?` · short ${c.dayShort}d/${c.nightShort}n`:''}</span>`}
function viewFloors(){const A=cur();if(!A.buildings.length)return head('What','Floor-by-floor walk','Record each floor as you walk it.')+`<div class="empty"><b style="font-size:17px;color:var(--fg)">No buildings yet</b><span>Name the buildings and choose their number of floors on the Site tab. Their floors will appear here.</span><button class="btn primary" data-act="go" data-v="facility">Go to Site</button></div>`;if(S.bIdx>=A.buildings.length)S.bIdx=0;const bi=S.bIdx,b=A.buildings[bi];
  const tabs=A.buildings.map((x,i)=>`<button class="btn small ${i===bi?'on':''}" data-act="bld" data-v="${i}">${esc(x.name||'Building '+(x.slot+1))}</button>`).join('');
  const floors=[...b.floors.map((f,fi)=>({f,fi}))].sort((x,y)=>num(y.f.level)-num(x.f.level));
  const p=`buildings.${bi}`;
  const G=groupOf(A),T=GROUP_TXT[G];const opts=A.assumptions.classes.filter(c=>grp(c)===G).map(c=>`<option value="${c.k}">${esc(c.name)} — ${c.perExit?c.perExit+'/exit':Math.round(c.pct*100)+'%'}</option>`).join('');
  const fl=floors.map(({f,fi})=>{const fp=`${p}.floors.${fi}`;const open=S.open[f.id];
    const units=f.units.map((u,ui)=>`<div class="unit"><select data-b="${fp}.units.${ui}.k" aria-label="${T.cls}">${A.assumptions.classes.filter(c=>grp(c)===G||c.k===u.k).map(c=>`<option value="${c.k}" ${c.k===u.k?'selected':''}>${esc(c.name)} — ${c.perExit?c.perExit+'/exit':Math.round(c.pct*100)+'%'}</option>`).join('')}</select><input type="number" inputmode="numeric" min="0" data-b="${fp}.units.${ui}.beds" data-t="num" value="${esc(u.beds)}" aria-label="${T.unit}" placeholder="${T.unit}"><button class="iconbtn" data-act="delUnit" data-p="${fp}" data-v="${ui}" aria-label="Remove unit">×</button></div>`).join('');
    const c=floorCalc(A,f);
    return`<details class="floor" ${open?'open':''} data-fid="${f.id}"><summary><div class="lvl"><small>LEVEL</small>${esc(f.level)}</div><div style="min-width:0"><b>${esc(f.label||'Floor '+f.level)}</b><div class="fsum" data-live="fs" data-p="${fp}">${floorSummary(A,f)}</div></div><span class="note">${open?'Close':'Open'}</span></summary>
    <div class="fbody">
      <div class="fsec"><h3>Floor</h3><div class="grid">${numIn(fp+'.level','Level (1 = exit level)')}${txt(fp+'.label',G==='health'?'Floor / unit name':'Floor name',G==='health'?'e.g. 4 West Med-Surg':G==='school'?'e.g. 2nd floor – Science wing':'e.g. 3rd floor – Finance')}${stepper(fp+'.stairwells','Protocol stairwells / exits')}${stepper(fp+'.bariatricPts',G==='health'?'Bariatric patients (typical)':'Bariatric occupants (typical)')}</div></div>
      ${G==='health'?`<div class="fsec"><h3>${T.walkH}</h3><p class="hint">${T.walkHint}</p>
        ${units||`<p class="hint">No ${G==='health'?'patient care units':'occupied spaces'} entered for this floor. Floors without them are covered at 1 sled per stairwell.</p>`}
        <div class="row"><select id="add-${f.id}" aria-label="Add ${T.cls.toLowerCase()}"><option value="">${G==='health'?'Add a care unit…':'Add a space…'}</option>${opts}</select></div></div>`:`<div class="fsec"><h3>${T.walkH}</h3><p class="hint">${T.walkHint}</p><div class="grid"><div class="f"><label for="i-${fp}.spaceType">Space type</label><select id="i-${fp}.spaceType" data-b="${fp}.spaceType"><option value="">Choose a space type…</option>${spacesFor(A,G).map(o=>`<option ${o===f.spaceType?'selected':''}>${esc(o)}</option>`).join('')}</select></div>${stepper(fp+'.occupants',G==='school'?'Students and staff':'Occupants')}</div></div>`}
      <div class="fsec"><h3>Staff & training</h3><div class="grid">${stepper(fp+'.staffDay','Staff on floor — day')}${stepper(fp+'.staffNight','Staff on floor — night')}${stepper(fp+'.trainedDay','Trained in Med Sled — day')}${stepper(fp+'.trainedNight','Trained in Med Sled — night')}</div>
        <div class="rowq"><span>Floor warden assigned — day</span>${yn(fp+'.wardenDay')}</div><div class="rowq"><span>Floor warden assigned — night</span>${yn(fp+'.wardenNight')}</div></div>
      <div class="fsec"><h3>Equipment on hand & storage</h3><div class="grid">${stepper(fp+'.onHandStd','Standard sleds (MS36) on floor')}${stepper(fp+'.onHandBari','Bariatric sleds (MS48) on floor')}${stepper(fp+'.onHandPeds','Infant / pediatric devices')}${txt(fp+'.storage','Storage location','e.g. Clean utility by Stair B')}</div>
        <div class="rowq"><span>Stored within sight of a protocol stairwell</span>${yn(fp+'.storageNearStair')}</div><div class="rowq"><span>Storage location signed</span>${yn(fp+'.storageSigned')}</div><div class="rowq"><span>Evacuation route posted on this floor</span>${yn(fp+'.routeSigned')}</div></div>
      <div class="fsec"><h3>Route conditions & impediments</h3><div>${IMPEDIMENTS.map(([k,l])=>`<div class="imp"><span>${l}</span><div class="row">${yn(fp+'.imp.'+k,[['OK','ok','okv'],['Concern','concern','warnv'],['Critical','critical','badv']])}<label class="iconbtn cam" title="Add a photo"><input type="file" accept="image/*" data-photo="${fp}" data-k="${k}" class="sr"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span class="sr">Add a photo of: ${esc(l)}</span></label></div>${thumbs(f,k,fp)}</div>`).join('')}</div></div>
      ${area(fp+'.notes','Floor notes')}
      <div class="calcbox" data-live="fc" data-p="${fp}">${calcBox(c)}</div>
      <div class="row" style="justify-content:space-between"><button class="btn small" data-act="dupFloor" data-p="${p}" data-v="${fi}">Copy to floor above</button>${S.confirmDel===f.id?`<div class="confirm">Remove this floor? <button class="btn small danger" data-act="delFloorYes" data-p="${p}" data-v="${fi}">Remove</button><button class="btn small" data-act="delNo">Keep</button></div>`:`<button class="btn small danger" data-act="delFloorAsk" data-v="${f.id}">Remove floor</button>`}</div>
    </div></details>`}).join('');
  const bc=buildingCalc(A,b);
  return head('What','Floor-by-floor walk','Record each floor as you walk it: who is there, what equipment and trained staff are on hand, and what could slow an extraction.')+
  `<div class="btabs">${tabs}</div>

   <div class="calcbox" data-live="bc" data-p="${p}">${bcBox(bc)}</div>
   <div class="row"><button class="btn primary" data-act="addFloor" data-p="${p}">+ Add floor above</button><button class="btn" data-act="addBasement" data-p="${p}">+ Add floor below</button></div></section>
  ${fl}`}
function calcBox(c){return`<div><b>${fmt(c.nonAmb,1)}</b><span>Non-ambulatory at census</span></div><div><b>${c.sleds}</b><span>Sleds required (${c.std} MS36 · ${c.bari} MS48)</span></div><div><b style="color:${c.gap?'var(--bad)':'var(--ok)'}">${c.gap}</b><span>Sled gap${c.bariGap?` (${c.bariGap} bariatric)`:''}</span></div><div><b>${c.rescuers}</b><span>Trained rescuers needed per shift</span></div>${c.peds?`<div><b>${c.peds}</b><span>Infant / pediatric beds</span></div>`:''}`}

function viewTraining(){const A=cur(),F=facilityCalc(A);
  return head('How','Training & turnover','How many trained rescuers the facility needs, and how often training must run to keep pace with turnover.')+

function missingClasses(A){const G=groupOf(A);return CLASSES.filter(c=>grp(c)===G&&!A.assumptions.classes.some(x=>x.k===c.k))}
function peoplePanel(A,G,T){const P=peopleRates(A);const f=(k,l,id)=>`<div class="f"><label for="${id}">${l}</label><input type="number" inputmode="decimal" step="1" min="0" max="100" id="${id}" data-b="assumptions.people.${k}" data-t="pct" value="${Math.round(num(P[k])*100)}"></div>`;
  return`<section class="panel"><h2>${T.h2}</h2><p class="hint">${esc(NONAMB_DEF)}</p>

   <p class="hint">These rates apply to every occupant, whatever the floor’s space type. <b>${T.cen}</b> is the share of the normal headcount present on a typical day. <b>% Non-ambulatory</b> covers people with a mobility disability or a temporary injury on an ordinary day, plus people injured in the event itself. It is an Ethos planning placeholder, not a published standard: about 1 in 7 U.S. adults has serious difficulty walking or climbing stairs (CDC), but many of them can still manage stairs slowly with help. <b>% Bariatric</b> defaults to 10%, close to the CDC’s 9.4% adult severe-obesity rate (2021–2023). Confirm each rate with the facility.</p></section>`}
function viewAssume(){const A=cur(),as=A.assumptions,G=groupOf(A),T=GROUP_TXT[G];

function missing(t){return`<span class="missing">${t||'Not recorded'}</span>`}
function val(v){return v&&String(v).trim()?esc(v):missing()}
function ynTxt(v){return v===true?'Yes':v===false?'No':v==='draft'?'Draft only':v==='partial'?'Partly':missing()}
function buildRecs(A,F,sc){const R=[];const add=(p,t)=>R.push([p,t]);
  for(const x of F.bs)for(const y of x.c.fl){const f=y.f,c=y.c,nm=`${x.b.name}, ${f.label||'level '+f.level}`;
    const parts=[];if(c.gap)parts.push(`add ${c.gap} sled${c.gap>1?'s':''}${c.bariGap?` (${c.bariGap} bariatric MS48)`:''}`);
    const sh=Math.max(c.dayShort,c.nightShort);if(sh)parts.push(`train ${sh} more rescuer${sh>1?'s':''} per shift (short ${c.dayShort} day${c.noNight?'':`, ${c.nightShort} night`})`);
    if(parts.length)add(1,`${nm}: ${parts.join('; ')}.`);
    const crit=IMPEDIMENTS.filter(([k])=>f.imp[k]==='critical').map(i=>i[1].toLowerCase());if(crit.length)add(1,`Correct critical route issues on ${nm}: ${crit.join('; ')}.`);
    if(f.storage&&f.storageNearStair===false)add(2,`Relocate equipment on ${nm} to within sight of a protocol stairwell.`);
    if(!f.storage.trim()&&c.sleds)add(2,`Designate an equipment storage location on ${nm}.`);
    if(f.storageSigned===false)add(2,`Sign the equipment storage location on ${nm}.`);
    if(f.wardenDay===false||(f.wardenNight===false&&!c.noNight))add(2,`Assign a floor warden for every shift on ${nm}.`);
    const con=IMPEDIMENTS.filter(([k])=>f.imp[k]==='concern').length;if(con)add(3,`Review ${con} route concern${con>1?'s':''} on ${nm}.`)}
  if(A.who.plan!==true)add(1,'Write or complete an evacuation plan that addresses non-ambulatory and injured occupants.');
  if(!A.who.operators.trim())add(1,'Name the team responsible for Med Sled extraction on each shift.');
  if(!A.who.activation.trim())add(2,'Define who has authority to order a full or partial evacuation.');
  if((A.when.criteria||[]).length<2)add(2,'Define the conditions under which staff begin extraction without waiting for EMS.');
  if(!A.where.critAssembly.trim())add(2,'Designate a critical-care assembly area for non-ambulatory evacuees.');
  else if((A.where.supplies||[]).length<4)add(3,'Stock the critical-care assembly area for continued care (water, warmth, medical supplies, power, communications).');
  if(num(A.who.drills)<1)add(2,'Hold at least one evacuation drill per year that includes a sled descent.');
  if(A.training.trainer!==true)add(3,'Certify in-house instructors through Ethos train-the-trainer so training keeps pace with turnover.');
  if(A.training.lms!==true)add(3,'Track training completions in an LMS so trained staff can be counted per shift.');
  return R.sort((a,b)=>a[0]-b[0])}
function reportPhotos(A,F){const items=[];for(const x of F.bs)for(const y of x.c.fl){const f=y.f;for(const [k,l] of IMPEDIMENTS)for(const ph of ((f.photos||{})[k]||[]))items.push({id:ph.id,cap:`${x.b.name}, ${f.label||'level '+f.level}`,l,r:f.imp[k]})}
  if(!items.length)return'';return`<h3 style="font-size:18px;margin-top:6px">Photo documentation</h3><div class="photos">${items.map(i=>`<figure><img src="${purl(i.id)}" data-pid="${esc(i.id)}" alt="${esc(i.l)}"><figcaption><b>${esc(i.l)}</b>${i.r?` · <span style="color:${i.r==='critical'?'var(--bad)':i.r==='concern'?'var(--warn)':'var(--ok)'}">${i.r==='ok'?'OK':i.r[0].toUpperCase()+i.r.slice(1)}</span>`:''}<br>${esc(i.cap)}</figcaption></figure>`).join('')}</div>`}
function reportHTML(A){const F=facilityCalc(A),sc=scores(A,F),[bn,col]=band(sc.overall),fa=A.facility;
  const bars=[['Equipment',sc.equipment],['Training',sc.training],['Planning',sc.planning],['Placement',sc.placement],['Route conditions',sc.route]].map(([l,v])=>{const c=v==null?'var(--line)':v>=.9?'var(--ok)':v>=.6?'var(--warn)':'var(--bad)';return`<div class="bar"><span>${l}</span><div class="track"><div class="fill" style="width:${v==null?0:Math.round(v*100)}%;background:${c}"></div></div><span class="num">${pct(v)}</span></div>`}).join('');
  const floorsRows=F.bs.flatMap(x=>[...x.c.fl].sort((a,b)=>num(b.f.level)-num(a.f.level)).map(y=>`<tr><td>${esc(x.b.name)}</td><td>${esc(y.f.label||'Level '+y.f.level)}${y.f.spaceType&&groupOf(A)!=='health'?`<br><span class="note">${esc(y.f.spaceType)}</span>`:''}</td><td class="n">${esc(y.f.level)}</td><td class="n">${fmt(y.c.nonAmb,1)}</td><td class="n">${y.c.sleds}</td><td class="n">${y.c.std}/${y.c.bari}</td><td class="n">${num(y.f.onHandStd)+num(y.f.onHandBari)}</td><td class="n" style="color:${y.c.gap?'var(--bad)':'inherit'}">${y.c.gap}</td><td class="n">${y.c.rescuers}</td><td class="n">${num(y.f.trainedDay)}/${num(y.f.trainedNight)}</td></tr>`)).join('');
  const whereRows=F.bs.flatMap(x=>x.c.fl.filter(y=>y.c.sleds).map(y=>`<tr><td>${esc(x.b.name)} · ${esc(y.f.label||'Level '+y.f.level)}</td><td>${y.f.storage?esc(y.f.storage):missing()}</td><td>${ynTxt(y.f.storageNearStair)}</td><td>${ynTxt(y.f.storageSigned)}</td><td>${ynTxt(y.f.routeSigned)}</td></tr>`)).join('');
  const impCounts=IMPEDIMENTS.map(([k,l])=>{let cr=0,co=0;for(const x of F.bs)for(const y of x.c.fl){if(y.f.imp[k]==='critical')cr++;if(y.f.imp[k]==='concern')co++}return{l,cr,co}}).filter(r=>r.cr||r.co);

  const recs=buildRecs(A,F,sc);

  const crit=SELF_EVAC.filter(([k])=>(A.when.criteria||[]).includes(k)).map(x=>x[1]);
  const sup=SUPPLIES.filter(([k])=>(A.where.supplies||[]).includes(k)).map(x=>x[1]);
  return`<div class="rep-head"><div class="eyebrow">Ethos Preparedness · Single-Flow Evacuation Readiness Report</div><h1>${esc(fa.name||'Untitled facility')}</h1>
   <div class="meta">${esc(fa.address)}${fa.address?' · ':''}${esc(fa.type)} · Assessed ${esc(fa.date)}${fa.assessor?' by '+esc(fa.assessor):''}${fa.contact?' · Facility contact: '+esc(fa.contact)+(fa.contactTitle?', '+esc(fa.contactTitle):''):''}</div>${A.example?'<div><span class="tag">Example data — not a real facility</span></div>':''}</div>
  <div class="verdict"><div class="dial" style="border-color:${col};color:${col}">${Math.round(sc.overall*100)}</div><div><h2 style="color:${col}">${bn}</h2><p style="margin:4px 0 0;color:var(--muted)">Readiness score out of 100, weighted across equipment (25), training (25), planning (20), placement (15) and route conditions (15). Scoring bands are provisional until Ethos publishes its Evacuation Ready standard.</p></div></div>
  <div class="tiles"><div class="tile"><b>${fmt(F.nonAmb,0)}</b><span>Non-ambulatory occupants at average census</span></div><div class="tile"><b>${F.onHand} / ${F.sleds}</b><span>Sleds on hand / required</span></div><div class="tile"><b>${F.perShift}</b><span>Trained rescuers needed every shift</span></div><div class="tile"><b>${F.maxTime==null?'—':fmt(F.maxTime)+' min'}</b><span>Est. evacuation time, fully equipped & staffed</span></div></div>
  <div class="bars">${bars}</div>
  <section class="rsec"><h2><span class="w">Why</span>Single-flow evacuation and the unmitigated risk</h2>
   <p>${esc(A.assumptions.definition)}</p>
   <p>${esc(NONAMB_DEF)}</p>
   <p>At average census, about <b>${fmt(F.nonAmb,0)}</b> people across <b>${F.floors}</b> floors of this facility cannot evacuate on their own${F.bs.some(x=>x.c.top>1)?', most of them above the exit level':''}${bariTotal?`, including about ${bariTotal} bariatric patients`:''}${pedsTotal?` and ${pedsTotal} infant or pediatric beds`:''}. Elevators are not available in a fire or after an earthquake, so each of these people must be carried down the stairs.</p>
   <p>In a regional disaster, fire and EMS resources are spread across the whole community at once and are triaged across many incidents.${A.ems.disasterWait?` The facility expects a wait of <b>${esc(A.ems.disasterWait)}</b> for outside help in that scenario${A.ems.normalMin?`, compared with about ${esc(A.ems.normalMin)} minutes on a normal day`:''}.`:''} A facility that depends on responders to carry its non-ambulatory occupants out is planning to leave those occupants behind. Today ${F.gap?`<b>${F.gap}</b> of the ${F.sleds} sleds needed are missing`:'the required sleds are in place'}, and trained rescuers cover ${pct(sc.training)} of the need across day and night shifts.</p></section>
  <section class="rsec"><h2><span class="w">Who</span>Activation and responsibility</h2><dl class="qa">

   <dt>Floor wardens assigned</dt><dd>${(()=>{let d=0,n=0,t=0;for(const x of F.bs)for(const f of x.b.floors){t++;if(f.wardenDay===true)d++;if(f.wardenNight===true)n++}return`${d} of ${t} floors on day shift, ${n} of ${t} on night shift`})()}</dd></dl></section>
  <section class="rsec"><h2><span class="w">What</span>Impediments and roles</h2>

   ${reportPhotos(A,F)}
   ${bariTotal?`<p>Evacuee size and weight: about ${bariTotal} bariatric patients are typically present; each needs a bariatric (MS48) sled and a larger team.</p>`:''}
   <dl class="qa"><dt>Floor warden</dt><dd>${val(A.who.wardenRole)}</dd><dt>Emergency response team</dt><dd>${val(A.who.ertRole)}</dd><dt>Security</dt><dd>${val(A.who.securityRole)}</dd></dl></section>

   <dl class="qa"><dt>Ambulatory assembly area</dt><dd>${val(A.where.ambAssembly)}</dd><dt>Critical-care assembly area</dt><dd>${val(A.where.critAssembly)}</dd><dt>Equipped with</dt><dd>${sup.length?esc(sup.join(', ')):missing('Nothing recorded')}</dd><dt>Ambulance transfer point</dt><dd>${val(A.where.transfer)}</dd><dt>Routes posted on every floor</dt><dd>${ynTxt(A.where.routesPosted)}</dd><dt>Floor plans on file</dt><dd>${ynTxt(A.where.maps)}</dd></dl></section>

   <p><b>Estimated evacuation time</b> with full equipment and crews, top floor down:<br>${bldTime}</p>

function liveRefresh(){const A=cur();if(!A)return;
  document.querySelectorAll('[data-live]').forEach(el=>{const t=el.dataset.live,p=el.dataset.p;

function readInput(el){const t=el.dataset.t;if(t==='bool')return el.checked;let v=el.value;if(t==='num')v=v===''?'':num(v);if(t==='pct')v=num(v)/100;return v}
document.addEventListener('input',e=>{const el=e.target;const A=cur();if(!A)return;

document.addEventListener('change',async e=>{const el=e.target;const A=cur();if(!A)return;
  if(el.dataset.photo){const file=el.files&&el.files[0];el.value='';if(!file)return;const fp=el.dataset.photo,k=el.dataset.k;const f=getPath(A,fp);
    S.uploading=f.id+':'+k;S.keepScroll=true;render();
    try{const blob=await shrink(file);if(!blob)throw{code:'unsupported_type'};const r={id:'p'+uid()+uid()};try{await photoPut(r.id,blob)}catch(e1){throw{code:'quota_or_state'}}PURL[r.id]=URL.createObjectURL(blob);
      const ff=getPath(cur(),fp);ff.photos=ff.photos||{};(ff.photos[k]=ff.photos[k]||[]).push({id:r.id,at:new Date().toISOString()});touch();toast('Photo saved')}
    catch(err){const c=err&&err.code;toast(c==='too_large'?'That photo is too large to save':c==='unsupported_type'?'That file type can’t be saved; use a JPEG or PNG photo':c==='quota_or_state'?'Photo didn’t save; device storage may be full':'Photo didn’t save; try again')}
    S.uploading=null;S.keepScroll=true;render();return}
  if(el.dataset.bfloors!=null){const i=+el.dataset.bfloors,n=el.value?parseInt(el.value,10):0;const b=slotBuilding(A,i);
    const lost=b.floors.filter(f=>num(f.level)>=1&&num(f.level)>n&&floorHasData(f));
    if(lost.length){S.pendingFloors={slot:i,n};pruneBuilding(A,b)}else{S.pendingFloors=null;applyFloors(A,b,n)}S.keepScroll=true;render();return}
  if(el.tagName==='SELECT'&&el.id&&el.id.startsWith('add-')){if(!el.value)return;const fid=el.id.slice(4);for(const b of A.buildings)for(const f of b.floors)if(f.id===fid)f.units.push({k:el.value,beds:''});touch();S.keepScroll=true;render();return}
  if(el.tagName==='SELECT'&&el.dataset.b){setPath(A,el.dataset.b,el.value);touch();liveRefresh();return}
  if(el.dataset.arr){const arr=getPath(A,el.dataset.arr)||[];const i=arr.indexOf(el.value);if(el.checked&&i<0)arr.push(el.value);if(!el.checked&&i>=0)arr.splice(i,1);setPath(A,el.dataset.arr,arr);touch();return}
  if(el.dataset.b&&(/\.level$/.test(el.dataset.b)||/\.crit$/.test(el.dataset.b))){S.keepScroll=true;render()}});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('floor')){S.open[d.dataset.fid]=d.open;const n=d.querySelector('summary .note');if(n)n.textContent=d.open?'Close':'Open'}},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('acard'))e.target.click()});
document.addEventListener('click',async e=>{
  const setb=e.target.closest('[data-set]');const A=cur();
  if(setb&&A){const p=setb.dataset.set,v=JSON.parse(setb.dataset.v);setPath(A,p,getPath(A,p)===v?null:v);touch();
    setb.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(getPath(A,p)===JSON.parse(b.dataset.v))));liveRefresh();return}
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,v=b.dataset.v,p=b.dataset.p;
  if(e.target.closest('[data-stop]')&&act==='open')return;
  switch(act){
   case'home':S.view='home';S.curId=null;S.confirmDel=null;render();window.scrollTo(0,0);break;
   case'new':{const n=newAssessment();S.map[n.id]=n;S.curId=n.id;S.view='facility';scheduleWrite(n.id);render();window.scrollTo(0,0);break}
   case'open':S.curId=v;S.view='facility';S.bIdx=0;render();window.scrollTo(0,0);break;
   case'delAsk':S.confirmDel=v;render();break;
   case'delNo':S.confirmDel=null;S.keepScroll=true;render();break;
   case'delYes':{const gone=S.map[v]?photoIds(S.map[v]):[];dropAssets(gone);delete S.map[v];delete S.dirty[v];clearTimeout(saveT[v]);S.confirmDel=null;try{await dbDel(v)}catch(err){toast('Couldn’t delete from device storage')}render();break}
   case'go':S.view=v;S.confirmDel=null;render();window.scrollTo(0,0);break;
   case'inc':case'dec':{const cv=num(getPath(A,p));setPath(A,p,Math.max(0,cv+(act==='inc'?1:-1)));const inp=document.getElementById('i-'+p);if(inp)inp.value=getPath(A,p);touch();liveRefresh();break}
   case'bld':S.bIdx=+v;render();break;
   case'floorsYes':{const pf=S.pendingFloors;S.pendingFloors=null;const bb=A.buildings.find(x=>x.slot===pf.slot);if(bb)applyFloors(A,bb,pf.n);S.keepScroll=true;render();break}
   case'delPhotoAsk':S.confirmDel='ph:'+v;S.keepScroll=true;render();break;
   case'delPhotoYes':{const f=getPath(A,p),k=b.dataset.k;f.photos[k]=(f.photos[k]||[]).filter(x=>x.id!==v);if(!f.photos[k].length)delete f.photos[k];S.confirmDel=null;touch();S.keepScroll=true;render();dropAssets([v]);break}
   case'floorsNo':S.pendingFloors=null;S.keepScroll=true;render();break;
   case'addFloor':{const bl=getPath(A,p);const top=bl.floors.length?Math.max(...bl.floors.map(f=>num(f.level))):0;const f=newFloor(top+1);bl.floors.push(f);S.open[f.id]=true;touch();S.keepScroll=true;render();break}
   case'addBasement':{const bl=getPath(A,p);const lo=bl.floors.length?Math.min(...bl.floors.map(f=>num(f.level))):2;const f=newFloor(lo-1);bl.floors.push(f);S.open[f.id]=true;touch();S.keepScroll=true;render();break}
   case'dupFloor':{const bl=getPath(A,p);const src=bl.floors[+v];const top=Math.max(...bl.floors.map(f=>num(f.level)));const f=JSON.parse(JSON.stringify(src));f.id=uid();f.level=top+1;f.label='';f.notes='';f.photos={};bl.floors.push(f);S.open[f.id]=true;touch();S.keepScroll=true;render();toast('Copied to level '+f.level);break}
   case'delFloorAsk':S.confirmDel=v;S.keepScroll=true;render();break;
   case'delFloorYes':dropAssets(photoIds(getPath(A,p).floors[+v]));getPath(A,p).floors.splice(+v,1);S.confirmDel=null;touch();S.keepScroll=true;render();break;
   case'delUnit':getPath(A,p).units.splice(+v,1);touch();S.keepScroll=true;render();break;
   case'applyBari':{for(const c of A.assumptions.classes)if(!c.crit)c.bari=num(A.assumptions.obesityRate);touch();S.keepScroll=true;render();toast('Applied to all non-critical classes');break}
   case'delClassAsk':S.confirmDel='cls:'+v;S.keepScroll=true;render();break;
   case'delClassYes':{A.assumptions.classes=A.assumptions.classes.filter(c=>c.k!==v);for(const bb of A.buildings)for(const f of bb.floors)f.units=f.units.filter(u=>u.k!==v);S.confirmDel=null;touch();S.keepScroll=true;render();break}
   case'restoreClasses':{const miss=missingClasses(A).map(c=>defClass(c));const order=CLASSES.map(c=>c.k);A.assumptions.classes=A.assumptions.classes.concat(miss).sort((a,b)=>{const ia=order.indexOf(a.k),ib=order.indexOf(b.k);return(ia<0?999:ia)-(ib<0?999:ib)});touch();S.keepScroll=true;render();toast('Restored '+miss.length+' care class'+(miss.length>1?'es':''));break}
   case'resetAssume':A.assumptions=defaultAssumptions();touch();render();toast('Assumptions reset');break;
   case'dlReport':toast('Preparing report…');await saveFile(fileBase(A)+' - Readiness Report.html',await embedPhotos(standaloneReport(A)));break;
   case'dlJson':await exportBackup([A],fileBase(A)+' - assessment data.json');break;
   case'backupAll':{const list=Object.values(S.map);if(!list.length){toast('No assessments to back up');break}await exportBackup(list,'Evacuation assessments backup '+new Date().toISOString().slice(0,10)+'.json');break}
   case'print':window.print();break;
   case'import':document.getElementById('importFile').click();break;
  }});
function fileBase(A){return(A.facility.name||'Assessment').replace(/[^\w\- ]+/g,'').trim()+' '+(A.facility.date||'')}
async function saveFile(name,data,type){
  const mime=type||(name.endsWith('.json')?'application/json':'text/html');const blob=new Blob([data],{type:mime});
  try{const file=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}
  catch(err){if(err&&err.name==='AbortError')return}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('File saved to Downloads')}
async function blobToDataURL(b){return await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>res('');fr.readAsDataURL(b)})}
async function dataURLToBlob(u){const r=await fetch(u);return await r.blob()}
async function packPhotos(list){const out={};for(const A of list)for(const id of photoIds(A)){try{const b=await photoGet(id);if(b)out[id]=await blobToDataURL(b)}catch(e){}}return out}
async function exportBackup(list,name){toast('Preparing file…');const photos=await packPhotos(list);
  await saveFile(name,JSON.stringify({format:'ethos-evac-backup',version:1,exportedAt:new Date().toISOString(),assessments:list,photos}))}
async function importAssessment(o){if(!o||!o.facility||!Array.isArray(o.buildings))throw 0;
  if(S.map[o.id]&&(S.map[o.id].updatedAt||'')>(o.updatedAt||''))o.id=uid();norm(o);o.assumptions=Object.assign(defaultAssumptions(),o.assumptions||{});
  S.map[o.id]=norm(o);await dbPut(o)}
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
  try{const o=JSON.parse(await file.text());let list,photos={};
    if(o&&o.format==='ethos-evac-backup'){list=o.assessments||[];photos=o.photos||{}}else list=[o];
    for(const id in photos){try{await photoPut(id,await dataURLToBlob(photos[id]))}catch(err){}}
    let n=0;for(const a of list){await importAssessment(a);n++}
    render();toast(n===1?'Imported '+(list[0].facility.name||'assessment'):'Imported '+n+' assessments')}
  catch(err){toast('That file isn’t an assessment export')}});
async function embedPhotos(html){const ids=[...new Set([...html.matchAll(/data-pid="([^"]+)"/g)].map(m=>m[1]))];
  for(const id of ids){let data='';try{const b=await photoGet(id);if(b)data=await blobToDataURL(b)}catch(e){}
    html=html.replace(new RegExp('src="[^"]*" data-pid="'+id.replace(/[^\w-]/g,'')+'"','g'),data?'src="'+data+'"':'src="" data-missing="1"')}return html}
function standaloneReport(A){const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  return`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(A.facility.name||'Facility')} — Single-Flow Evacuation Readiness Report</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"><style>${css}
  :root{color-scheme:light}body{background:#fff;padding:24px}.report{max-width:960px;margin:0 auto;border:0;padding:0}
  @media print{body{padding:0}.rsec,.tablewrap,.bars,.verdict{break-inside:avoid}.report{gap:18px}}</style></head>
  <body data-theme="light"><article class="report">${reportHTML(A)}</article></body></html>`.replace('<html>','<html data-theme="light">')}

/* ============ Boot ============ */
(async()=>{
  try{idb=await openDB();const all=await dbAll();for(const A of all||[])S.map[A.id]=norm(A);setStatus('Saved on this device','ok')}
  catch(e){setStatus('Storage unavailable — assessments won’t be kept','warn')}
  render();
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){try{await navigator.serviceWorker.register('sw.js')}catch(e){}}
})();
</script>
